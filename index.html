<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Canucks Cap Tool</title>
  <style>
    :root{--bg:#091322;--panel:#101d31;--panel2:#16253d;--row:#1b2b46;--row2:#142238;--line:#2b4163;--ink:#f8fafc;--muted:#9fb1c9;--blue:#0065b3;--blue2:#003e7e;--green:#00a651;--red:#e13d3d;--orange:#f59e0b;--card:#203b68;--white:#fff;--black:#07111f}
    *{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif} button,input,select,textarea{font:inherit} .shell{max-width:1220px;margin:0 auto;padding:0 14px 90px}
    header{background:linear-gradient(135deg,#07111f 0%,#062d5c 55%,#0072ce 100%);border-bottom:1px solid rgba(255,255,255,.12);position:sticky;top:0;z-index:20;box-shadow:0 8px 30px rgba(0,0,0,.28)}
    .top{max-width:1220px;margin:0 auto;padding:18px 14px 14px;display:flex;align-items:center;justify-content:space-between;gap:12px}.brand h1{margin:0;font-size:24px;letter-spacing:.04em;text-transform:uppercase}.brand p{margin:3px 0 0;color:#d7e5f7;font-size:13px}.updated{border:1px solid rgba(255,255,255,.24);border-radius:999px;padding:8px 12px;background:rgba(255,255,255,.12);font-size:12px;white-space:nowrap}.tabs{max-width:1220px;margin:0 auto;display:flex;gap:2px;overflow:auto;padding:0 14px 12px}.tab{border:0;background:transparent;color:#dbeafe;border-bottom:3px solid transparent;padding:12px 11px;font-weight:800;white-space:nowrap;cursor:pointer}.tab.active{color:#fff;border-color:var(--green);background:rgba(255,255,255,.06);border-radius:9px 9px 0 0}
    .capbar{display:grid;grid-template-columns:repeat(5,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:14px;overflow:hidden;margin:16px 0}.capcell{background:var(--panel);padding:14px}.label{font-size:11px;text-transform:uppercase;letter-spacing:.12em;color:var(--muted);font-weight:900}.value{font-size:23px;font-weight:950;margin-top:4px}.green{color:#34d399}.red{color:#f87171}.orange{color:#fbbf24}.muted{color:var(--muted)}.small{font-size:12px}.section{margin:20px 0 10px;display:flex;align-items:end;justify-content:space-between;gap:10px}.section h2{margin:0;font-size:18px;text-transform:uppercase;letter-spacing:.07em}.subhead{color:var(--muted);font-size:13px;margin-top:3px}
    .panel{background:var(--panel);border:1px solid var(--line);border-radius:16px;overflow:hidden}.panel-pad{padding:14px}.split{display:grid;grid-template-columns:1fr 1fr;gap:14px}.three{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.btn{border:0;border-radius:10px;padding:10px 12px;font-weight:900;cursor:pointer;background:var(--blue);color:#fff}.btn.green{background:var(--green)}.btn.red{background:var(--red)}.btn.gray{background:#475569}.btn.dark{background:var(--row)}.btn:disabled{opacity:.45;cursor:not-allowed}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}.input,select,textarea{width:100%;border:1px solid var(--line);background:#0b1729;color:var(--ink);border-radius:10px;padding:10px;font-size:15px}textarea{min-height:95px}.field label{display:block;margin:10px 0 5px}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.notice{border-radius:12px;padding:12px;margin:10px 0;font-weight:800}.notice.red{background:#451a1a;color:#fecaca;border:1px solid #7f1d1d}.notice.warn{background:#422006;color:#fde68a;border:1px solid #92400e}.notice.green{background:#052e1a;color:#bbf7d0;border:1px solid #166534}
    table{width:100%;border-collapse:separate;border-spacing:0}.table-wrap{border:1px solid var(--line);border-radius:14px;overflow:auto;background:var(--panel)}th,td{padding:10px 11px;border-bottom:1px solid var(--line);font-size:13px;white-space:nowrap}th{background:#0c1a2d;color:#dceafe;text-align:left;text-transform:uppercase;letter-spacing:.08em;font-size:11px;position:sticky;top:0}td{background:var(--row2)}tr:nth-child(even) td{background:var(--row)}tr:hover td{background:#243b61;cursor:pointer}tr:last-child td{border-bottom:0}.money{font-weight:950;color:#e6f0ff}.tag{display:inline-block;border-radius:999px;padding:4px 8px;font-size:11px;font-weight:900;background:#213657;color:#dbeafe}.tag.green{background:#064e3b;color:#bbf7d0}.tag.warn{background:#78350f;color:#fde68a}.tag.red{background:#7f1d1d;color:#fecaca}.namecell b{font-size:14px}.namecell span{display:block;color:var(--muted);font-size:12px;margin-top:2px}.totalrow td{background:#07111f!important;font-weight:900;color:#fff}
    .lineup-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.lineup-grid.def{grid-template-columns:repeat(3,1fr)}.slot-title{text-align:center;font-weight:950;margin:8px 0 8px;font-size:16px}.player-card{position:relative;background:linear-gradient(135deg,#1c3d76,#203966);border:1px solid #31558a;border-radius:10px;margin-bottom:8px;min-height:74px;overflow:hidden;box-shadow:0 8px 18px rgba(0,0,0,.22)}.player-card:after{content:'VAN';position:absolute;right:10px;top:4px;font-size:42px;font-weight:950;color:rgba(255,255,255,.06)}.pc-inner{position:relative;z-index:1;display:grid;grid-template-columns:72px 1fr;gap:8px;padding:9px}.ovrbox{font-size:34px;font-weight:1000;line-height:1;color:#f15a24;-webkit-text-stroke:1px #fff;text-shadow:1px 1px 0 #001f5b}.pc-name{font-size:18px;font-weight:950;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.pc-meta{color:#e5eefc;font-size:13px;font-weight:800}.pc-bottom{position:absolute;right:8px;bottom:6px;font-size:12px;color:#dbeafe}.empty-slot{border:1px dashed var(--line);border-radius:10px;padding:22px;text-align:center;color:var(--muted);background:rgba(255,255,255,.03);margin-bottom:8px}.center-logo{text-align:center;color:#9fb1c9;font-weight:950;letter-spacing:.08em;margin:12px 0;font-size:24px;opacity:.5}.modal{position:fixed;inset:0;background:rgba(0,0,0,.62);z-index:100;display:flex;align-items:flex-end;justify-content:center;padding:12px}.hidden{display:none!important}.modal-card{background:#0c1728;border:1px solid var(--line);border-radius:18px;width:100%;max-width:760px;max-height:90vh;overflow:auto;padding:16px}.modal-head{display:flex;align-items:start;justify-content:space-between;gap:10px}.asset-chip{display:flex;justify-content:space-between;gap:10px;align-items:center;background:var(--row2);border:1px solid var(--line);border-radius:12px;padding:10px;margin:8px 0}.search-results{max-height:360px;overflow:auto;border:1px solid var(--line);border-radius:12px}.search-row{padding:10px;border-bottom:1px solid var(--line);cursor:pointer}.search-row:hover{background:var(--row)}.summary-line{display:flex;justify-content:space-between;border-bottom:1px solid var(--line);padding:8px 0}.summary-line:last-child{border-bottom:0}
    @media(max-width:800px){.shell{padding-left:10px;padding-right:10px}.top{padding:14px 10px}.brand h1{font-size:18px}.tabs{padding-left:10px}.capbar{grid-template-columns:repeat(2,1fr)}.capcell:last-child{grid-column:1/-1}.split,.three{grid-template-columns:1fr}.form-grid{grid-template-columns:1fr}.lineup-grid,.lineup-grid.def{grid-template-columns:1fr}.pc-name{font-size:16px}th,td{padding:9px 8px} .hide-mobile{display:none}}
  </style>
</head>
<body>
<header><div class="top"><div class="brand"><h1>Canucks Cap Tool</h1><p>Vancouver Sim League Hockey Operations</p></div><div class="updated" id="lastUpdated">Loading…</div></div><nav class="tabs" id="tabs"></nav></header>
<main class="shell"><section id="view"></section></main><div id="modal" class="hidden"></div>
<script>
const API_URL = 'https://script.google.com/macros/s/AKfycbz2OTFddx6itm8ILbc6dPgjyPHlxc-zv9p9o_RcoHLbj1QW2FIMIr5m0dbwr4qlLc3JLg/exec';
const TABS=['Overview','NHL Roster','Lineup','Non-Roster','Players','Free Agents','Trade Center','Expiring','Notes','History'];
let state={settings:{},assets:[],notes:[],history:[],summary:{},tab:'Overview',filter:'All',search:''};
let trade={outIds:[],incoming:[],notes:'',changedBy:''};
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>\"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));
function m(n){n=Number(n||0);let sign=n<0?'-':'';n=Math.abs(n);if(n>=1e6)return sign+'$'+(n/1e6).toFixed(2).replace(/\.00$/,'')+'M';if(n>=1e3)return sign+'$'+(n/1e3).toFixed(0)+'K';return sign+'$'+n.toLocaleString()}
function full(n){return Number(n||0).toLocaleString(undefined,{maximumFractionDigits:3})} function name(x){return String(x||'').replace(/,([^ ])/g,', $1')} function dur(v){let n=Number(v);return isFinite(n)?String(Math.round(n)):(v||'')} function ovr(a){let n=Number(a.quality);return isFinite(n)?String(Math.round(n)):''} function exp(a){return Math.round(Number(a.contractDuration))===1} function isNHL(a){return a.rosterStatus==='NHL Roster'} function isNon(a){return a.rosterStatus==='Non-Roster'} function teamV(a){return isNHL(a)||isNon(a)} function sal(a){return Number(a.salary||0)||0}
function group(a){let p=String(a.position||'').toUpperCase(); if(p==='G'||p.includes('GARD'))return 'Goalies'; if(p.includes('D'))return 'Defense'; return 'Forwards'} function posRank(a){return {'Forwards':1,'Defense':2,'Goalies':3}[group(a)]||4} function sortRoster(a,b){return posRank(a)-posRank(b)||String(a.position).localeCompare(String(b.position))||Number(ovr(b)||0)-Number(ovr(a)||0)}
async function load(){let r=await fetch(API_URL+'?action=getData'),d=await r.json();if(!d.ok)throw Error(d.error||'Load failed');state={...state,...d};$('lastUpdated').textContent='Updated '+new Date().toLocaleTimeString([],{hour:'numeric',minute:'2-digit'});render()}
async function post(payload){let body=new URLSearchParams();body.set('payload',JSON.stringify(payload));let r=await fetch(API_URL,{method:'POST',body}),d=await r.json();if(!d.ok)throw Error(d.error||'Save failed');if(d.data)state={...state,...d.data};render()}
function tabs(){ $('tabs').innerHTML=TABS.map(t=>`<button class="tab ${state.tab===t?'active':''}" onclick="state.tab='${t}';render()">${t}</button>`).join('') }
function capbar(){let s=state.summary, avail=Number(s.availableCap||0), overRoster=s.nhlRosterCount>s.rosterLimit;return `<div class="capbar"><div class="capcell"><div class="label">Projected Cap Hit</div><div class="value ${s.overCap?'red':'green'}">${m(s.capHit)}</div><div class="muted small">Cap ${m(s.cap)}</div></div><div class="capcell"><div class="label">Projected Cap Space</div><div class="value ${avail<0?'red':'green'}">${m(avail)}</div><div class="muted small">Hard cap enabled</div></div><div class="capcell"><div class="label">Active Roster</div><div class="value ${overRoster?'orange':'green'}">${s.nhlRosterCount}/${s.rosterLimit}</div><div class="muted small">NHL only</div></div><div class="capcell"><div class="label">Expiring</div><div class="value orange">${s.expiringCount}</div><div class="muted small">All assets</div></div><div class="capcell"><div class="label">Status</div><div class="value ${s.overCap?'red':'green'}">${s.overCap?'Over Cap':'Compliant'}</div><div class="muted small">${overRoster?'Roster warning':'Roster OK'}</div></div></div>`}
function render(){tabs();let f={'Overview':overview,'NHL Roster':nhlRoster,'Lineup':lineup,'Non-Roster':nonRoster,'Players':players,'Free Agents':freeAgents,'Trade Center':tradeView,'Expiring':expiringView,'Notes':notesView,'History':historyView}[state.tab]||overview;f()}
function overview(){let nhl=state.assets.filter(isNHL), forwards=nhl.filter(a=>group(a)==='Forwards'), def=nhl.filter(a=>group(a)==='Defense'), goalies=nhl.filter(a=>group(a)==='Goalies');$('view').innerHTML=capbar()+`<div class="section"><div><h2>Roster Breakdown</h2><div class="subhead">Current Vancouver NHL roster by group</div></div></div><div class="three">${breakCard('Forwards',forwards)}${breakCard('Defense',def)}${breakCard('Goalies',goalies)}</div><div class="section"><h2>Quick Roster View</h2></div>${table(nhl.sort(sortRoster).slice(0,60))}`}
function breakCard(title,list){let total=list.reduce((s,a)=>s+sal(a),0);return `<div class="panel panel-pad"><div class="label">${title}</div><div class="value">${list.length}</div><div class="muted">${m(total)} · ${state.summary.cap?((total/state.summary.cap)*100).toFixed(1):0}% of cap</div></div>`}
function sectionTable(title,list){let total=list.reduce((s,a)=>s+sal(a),0);return `<div class="section"><div><h2>${title}</h2><div class="subhead">${list.length} assets · ${m(total)}</div></div></div>${table(list,true,total)}`}
function nhlRoster(){let list=state.assets.filter(isNHL).sort(sortRoster);$('view').innerHTML=capbar()+sectionTable('Forwards',list.filter(a=>group(a)==='Forwards'))+sectionTable('Defense',list.filter(a=>group(a)==='Defense'))+sectionTable('Goalies',list.filter(a=>group(a)==='Goalies'))}
function nonRoster(){let list=state.assets.filter(isNon).sort((a,b)=>Number(ovr(b)||0)-Number(ovr(a)||0));$('view').innerHTML=capbar()+`<div class="notice warn">Non-roster assets do not count against the salary cap or 23-player NHL roster limit unless moved to NHL Roster.</div>`+table(list)}
function table(list,showTotal=false,total=0){return `<div class="table-wrap"><table><thead><tr><th>Name</th><th>Pos</th><th>OVR</th><th class="hide-mobile">Age</th><th>Team</th><th>Status</th><th>Dur.</th><th>Cap Hit</th></tr></thead><tbody>${list.map(a=>`<tr onclick="openAsset('${a.assetId}')"><td class="namecell"><b>${esc(name(a.name))}</b><span>${esc(a.potential||'')} ${esc(a.style||'')}</span></td><td>${esc(a.position||'')}</td><td><b>${esc(ovr(a))}</b></td><td class="hide-mobile">${esc(a.age||'')}</td><td>${esc(a.teamAbbreviation||'')}</td><td><span class="tag ${isNHL(a)?'green':isNon(a)?'':'warn'}">${esc(a.rosterStatus||'')}</span></td><td>${esc(dur(a.contractDuration))}</td><td class="money">${m(a.salary)}</td></tr>`).join('')}${showTotal?`<tr class="totalrow"><td colspan="7">TOTAL</td><td>${m(total)}</td></tr>`:''}</tbody></table></div>`}
function lineup(){let nhl=state.assets.filter(isNHL).sort((a,b)=>Number(ovr(b)||0)-Number(ovr(a)||0));let forwards=nhl.filter(a=>group(a)==='Forwards'), defense=nhl.filter(a=>group(a)==='Defense'), goalies=nhl.filter(a=>group(a)==='Goalies');let lw=forwards.filter(a=>/AG|LW/i.test(a.position)).slice(0,4), c=forwards.filter(a=>/C/i.test(a.position)).slice(0,4), rw=forwards.filter(a=>/AD|RW/i.test(a.position)).slice(0,4);let used=new Set([...lw,...c,...rw].map(a=>a.assetId));for(let a of forwards){ if(used.size>=12)break; if(!used.has(a.assetId)){ let arr=[lw,c,rw].sort((x,y)=>x.length-y.length)[0]; if(arr.length<4){arr.push(a);used.add(a.assetId)} }}let leftD=defense.filter(a=>/DG|LD|G/i.test(a.position)).slice(0,3), rightD=defense.filter(a=>/DD|RD|D/i.test(a.position)&&!leftD.find(x=>x.assetId===a.assetId)).slice(0,3);for(let a of defense){ if(leftD.length+rightD.length>=6)break; if(!leftD.find(x=>x.assetId===a.assetId)&&!rightD.find(x=>x.assetId===a.assetId)){(leftD.length<=rightD.length?leftD:rightD).push(a)}}$('view').innerHTML=capbar()+`<div class="section"><div><h2>NHL Lineup</h2><div class="subhead">Auto-generated by position and OVR. Manual lineup editing can be added later.</div></div></div><div class="lineup-grid"><div><div class="slot-title">Left Wing</div>${cards(lw,4)}</div><div><div class="slot-title">Center</div>${cards(c,4)}</div><div><div class="slot-title">Right Wing</div>${cards(rw,4)}</div></div><div class="center-logo">CANUCKS CAP TOOL</div><div class="lineup-grid def"><div><div class="slot-title">Left Defense</div>${cards(leftD,3)}</div><div><div class="slot-title">Right Defense</div>${cards(rightD,3)}</div><div><div class="slot-title">Goalie</div>${cards(goalies.slice(0,3),3)}</div></div>`}
function cards(list,count){let out='';for(let i=0;i<count;i++){let a=list[i];out+=a?`<div class="player-card" onclick="openAsset('${a.assetId}')"><div class="pc-inner"><div class="ovrbox">${esc(ovr(a)||'--')}</div><div><div class="pc-name">${esc(name(a.name).split(',')[0])}</div><div class="pc-meta">${m(a.salary)}</div></div></div><div class="pc-bottom">${esc(a.age||'')} · ${esc(a.position||'')} · YR ${esc(dur(a.contractDuration))}</div></div>`:`<div class="empty-slot">Open slot</div>`}return out}
function players(){let filters=['All','Vancouver','Available / Other','NHL Roster','Non-Roster','Expiring'];let list=state.assets.slice();if(state.filter==='Vancouver')list=list.filter(teamV);if(state.filter==='Available / Other')list=list.filter(a=>a.rosterStatus==='Available-Other');if(state.filter==='NHL Roster')list=list.filter(isNHL);if(state.filter==='Non-Roster')list=list.filter(isNon);if(state.filter==='Expiring')list=list.filter(exp);if(state.search)list=list.filter(a=>(String(a.name)+' '+String(a.teamAbbreviation)+' '+String(a.position)).toLowerCase().includes(state.search.toLowerCase()));list=list.sort((a,b)=>String(a.name).localeCompare(String(b.name))).slice(0,350);$('view').innerHTML=capbar()+`<div class="section"><h2>Players & Assets</h2></div><input class="input" placeholder="Search player, team, position…" value="${esc(state.search)}" oninput="state.search=this.value;render()"><div class="toolbar">${filters.map(f=>`<button class="btn ${state.filter===f?'green':'dark'}" onclick="state.filter='${f}';render()">${f}</button>`).join('')}</div>${table(list)}`}
function freeAgents(){let list=state.assets.filter(a=>a.rosterStatus==='Available-Other');if(state.search)list=list.filter(a=>(String(a.name)+' '+String(a.teamAbbreviation)+' '+String(a.position)).toLowerCase().includes(state.search.toLowerCase()));list=list.sort((a,b)=>Number(ovr(b)||0)-Number(ovr(a)||0)).slice(0,300);$('view').innerHTML=capbar()+`<div class="section"><div><h2>Free Agents / Sign Player</h2><div class="subhead">Search available assets and sign them to NHL Roster or Non-Roster.</div></div></div><input class="input" placeholder="Search available players/assets…" value="${esc(state.search)}" oninput="state.search=this.value;render()">${table(list)}`}
function expiringView(){let list=state.assets.filter(exp).sort((a,b)=>String(a.rosterStatus).localeCompare(String(b.rosterStatus))||String(a.name).localeCompare(String(b.name)));$('view').innerHTML=capbar()+`<div class="notice warn">Contract duration of 1 = expiring after the current season. Everyone is included.</div>`+table(list)}
function notesView(){let notes=state.notes.slice().reverse();$('view').innerHTML=capbar()+`<div class="section"><h2>Team Notes</h2></div><div class="panel panel-pad"><div class="form-grid"><div class="field"><label>Changed By</label><select id="noteBy"><option value="">Choose…</option><option>Cam</option><option>Gabe</option></select></div></div><div class="field"><label>New Team Note</label><textarea id="teamNote"></textarea></div><button class="btn green" onclick="saveTeamNote()">Save Note</button></div><div class="section"><h2>Recent Notes</h2></div>${notes.map(n=>`<div class="panel panel-pad" style="margin-bottom:10px"><b>${esc(n.title||n.scope||'Note')}</b><div class="muted small">${esc(n.changedBy||'')} · ${esc(n.updatedAt||'')}</div><p>${esc(n.body||'')}</p></div>`).join('')||'<div class="notice warn">No notes yet.</div>'}`}
async function saveTeamNote(){try{await post({action:'saveTeamNote',changedBy:$('noteBy').value,noteText:$('teamNote').value,title:'Team Note'})}catch(e){alert(e.message)}}
function historyView(){$('view').innerHTML=capbar()+`<div class="section"><h2>History</h2></div>${state.history.map(h=>`<div class="panel panel-pad" style="margin-bottom:10px"><b>${esc(h.action||'History')}</b><div class="muted small">${esc(h.timestamp||'')} · Changed by ${esc(h.changedBy||'')}</div><div>${esc(h.summary||'')}</div><div class="muted small">${esc(h.details||'')}</div></div>`).join('')||'<div class="notice warn">No history yet.</div>'}`}
function openAsset(id){let a=state.assets.find(x=>x.assetId===id);if(!a)return;let notes=state.notes.filter(n=>n.assetId===id).slice().reverse();let isAvail=a.rosterStatus==='Available-Other';$('modal').className='modal';$('modal').innerHTML=`<div class="modal-card"><div class="modal-head"><div><h2>${esc(name(a.name))}</h2><div class="muted">${esc(a.teamAbbreviation)} · ${esc(a.position)} · OVR ${esc(ovr(a))} · ${esc(a.rosterStatus)}</div></div><button class="btn gray" onclick="closeModal()">Close</button></div><div class="form-grid"><div class="field"><label>Salary</label><input id="assetSalary" class="input" value="${esc(a.salary||'')}"></div><div class="field"><label>Contract Duration</label><input id="assetDuration" type="number" step="1" class="input" value="${esc(dur(a.contractDuration))}"></div><div class="field"><label>Asset Type</label><select id="assetType"><option>NHL Player</option><option>AHL Player</option><option>Prospect</option><option>Draft Pick</option><option>Other</option></select></div><div class="field"><label>Roster Status</label><select id="assetStatus"><option>NHL Roster</option><option>Non-Roster</option><option>Available-Other</option></select></div><div class="field"><label>Changed By</label><select id="assetBy"><option value="">Choose…</option><option>Cam</option><option>Gabe</option></select></div></div><div class="field"><label>Player Notes</label><textarea id="assetNotes">${esc(a.playerNotes||'')}</textarea></div><div class="toolbar"><button class="btn green" onclick="saveAsset('${id}')">Save Player</button><button class="btn" onclick="moveAsset('${id}')">Move Status Only</button>${isAvail?`<button class="btn green" onclick="openSigning('${id}')">Sign Player</button>`:''}</div><div class="section"><h2>Add Player Note</h2></div><textarea id="newPlayerNote"></textarea><button class="btn green" onclick="savePlayerNote('${id}')">Save Player Note</button>${notes.map(n=>`<div class="notice warn"><b>${esc(n.changedBy)}</b>: ${esc(n.body)}</div>`).join('')}</div>`;$('assetType').value=a.assetType||'NHL Player';$('assetStatus').value=a.rosterStatus||'Available-Other'}
function closeModal(){$('modal').className='hidden';$('modal').innerHTML=''}
async function saveAsset(id){try{await post({action:'updateAsset',assetId:id,salary:$('assetSalary').value,contractDuration:$('assetDuration').value,assetType:$('assetType').value,playerNotes:$('assetNotes').value,changedBy:$('assetBy').value});closeModal()}catch(e){alert(e.message)}}
async function moveAsset(id){try{await post({action:'moveAsset',assetId:id,rosterStatus:$('assetStatus').value,changedBy:$('assetBy').value});closeModal()}catch(e){alert(e.message)}}
async function savePlayerNote(id){try{await post({action:'savePlayerNote',assetId:id,changedBy:$('assetBy').value,noteText:$('newPlayerNote').value,title:'Player Note'});openAsset(id)}catch(e){alert(e.message)}}
function openSigning(id){let a=state.assets.find(x=>x.assetId===id);$('modal').className='modal';$('modal').innerHTML=`<div class="modal-card"><div class="modal-head"><div><h2>Sign ${esc(name(a.name))}</h2><div class="muted">Current: ${m(a.salary)} · Duration ${dur(a.contractDuration)}</div></div><button class="btn gray" onclick="closeModal()">Close</button></div><div class="form-grid"><div class="field"><label>New Salary</label><input id="signSalary" class="input" value="${esc(a.salary||0)}"></div><div class="field"><label>Contract Duration</label><input id="signDuration" class="input" type="number" step="1" value="${esc(dur(a.contractDuration)||1)}"></div><div class="field"><label>Destination</label><select id="signStatus"><option>NHL Roster</option><option selected>Non-Roster</option></select></div><div class="field"><label>Changed By</label><select id="signBy"><option value="">Choose…</option><option>Cam</option><option>Gabe</option></select></div></div><div class="field"><label>Signing Notes</label><textarea id="signNotes"></textarea></div><button class="btn green" onclick="confirmSigning('${id}')">Preview / Confirm Signing</button></div>`}
async function confirmSigning(id){let a=state.assets.find(x=>x.assetId===id), salary=Number($('signSalary').value||0), status=$('signStatus').value;let newCap=Number(state.summary.capHit||0)+(status==='NHL Roster'?salary:0);let msg=`Sign ${name(a.name)}?\n\nProjected cap hit: ${m(newCap)}\nAvailable cap: ${m(Number(state.summary.cap||0)-newCap)}`;if(newCap>Number(state.summary.cap||0)){alert('You cannot complete this signing, as this will have you OVER the salary cap.');return}if(!confirm(msg))return;try{await post({action:'signFreeAgent',assetId:id,salary:$('signSalary').value,contractDuration:$('signDuration').value,rosterStatus:status,changedBy:$('signBy').value,notes:$('signNotes').value});closeModal()}catch(e){alert(e.message)}}
function tradeView(){let out=trade.outIds.map(id=>state.assets.find(a=>a.assetId===id)).filter(Boolean), inn=trade.incoming.map(x=>({item:x,asset:state.assets.find(a=>a.assetId===x.assetId)})).filter(x=>x.asset);let current=Number(state.summary.capHit||0), outCap=out.filter(isNHL).reduce((s,a)=>s+sal(a),0), inCap=inn.filter(x=>x.item.rosterStatus==='NHL Roster').reduce((s,x)=>s+Math.max(0,Number(x.item.salary||x.asset.salary||0)-Number(x.item.retainedSalary||0)),0), newCap=current-outCap+inCap, cap=Number(state.summary.cap||0), over=newCap>cap;$('view').innerHTML=capbar()+`<div class="section"><div><h2>Trade Center</h2><div class="subhead">Preview-only until Confirm Trade. Hard cap blocks illegal trades.</div></div></div>${over?`<div class="notice red">You cannot complete this trade, as this will have you OVER the salary cap.</div>`:''}<div class="split"><div class="panel panel-pad"><h3>Vancouver Sends</h3><button class="btn" onclick="openTradeSearch('out')">+ Add Outgoing Asset</button>${out.map(a=>chip(a,`removeOut('${a.assetId}')`)).join('')||'<p class="muted">No outgoing assets selected.</p>'}</div><div class="panel panel-pad"><h3>Vancouver Receives</h3><button class="btn" onclick="openTradeSearch('in')">+ Add Incoming Asset</button>${inn.map(inChip).join('')||'<p class="muted">No incoming assets selected.</p>'}</div></div><div class="section"><h2>Cap Impact</h2></div><div class="panel panel-pad"><div class="summary-line"><span>Current Cap Hit</span><b>${m(current)}</b></div><div class="summary-line"><span>Outgoing NHL Cap Removed</span><b>-${m(outCap)}</b></div><div class="summary-line"><span>Incoming NHL Cap Added</span><b>+${m(inCap)}</b></div><div class="summary-line"><span>Projected Cap Hit</span><b class="${over?'red':'green'}">${m(newCap)}</b></div><div class="summary-line"><span>Projected Cap Space</span><b>${m(cap-newCap)}</b></div><div class="form-grid"><div class="field"><label>Changed By</label><select id="tradeBy"><option value="">Choose…</option><option ${trade.changedBy==='Cam'?'selected':''}>Cam</option><option ${trade.changedBy==='Gabe'?'selected':''}>Gabe</option></select></div></div><div class="field"><label>Trade Notes</label><textarea id="tradeNotes" oninput="trade.notes=this.value">${esc(trade.notes||'')}</textarea></div><button class="btn green" ${over||(!out.length&&!inn.length)?'disabled':''} onclick="confirmTrade()">Confirm Trade</button></div>`}
function chip(a,call){return `<div class="asset-chip"><div><b>${esc(name(a.name))}</b><div class="muted small">${esc(a.position)} · OVR ${esc(ovr(a))} · ${m(a.salary)} · ${esc(a.rosterStatus)}</div></div><button class="btn red" onclick="${call}">Remove</button></div>`} function inChip(x){let a=x.asset,i=x.item;return `<div class="asset-chip"><div><b>${esc(name(a.name))}</b><div class="muted small">${esc(a.position)} · ${m(i.salary||a.salary)} less retained ${m(i.retainedSalary||0)} → ${esc(i.rosterStatus)}</div></div><button class="btn red" onclick="removeIn('${a.assetId}')">Remove</button></div>`}
function removeOut(id){trade.outIds=trade.outIds.filter(x=>x!==id);render()} function removeIn(id){trade.incoming=trade.incoming.filter(x=>x.assetId!==id);render()}
function openTradeSearch(mode){$('modal').className='modal';$('modal').innerHTML=`<div class="modal-card"><div class="modal-head"><h2>Add ${mode==='out'?'Outgoing':'Incoming'} Asset</h2><button class="btn gray" onclick="closeModal()">Close</button></div><input class="input" id="tradeSearch" placeholder="Search assets…" oninput="renderTradeResults('${mode}')"><div id="tradeResults" class="search-results"></div></div>`;renderTradeResults(mode)}
function renderTradeResults(mode){let q=($('tradeSearch')?.value||'').toLowerCase(),list=state.assets.filter(a=>(String(a.name)+' '+String(a.teamAbbreviation)+' '+String(a.position)).toLowerCase().includes(q));list=mode==='out'?list.filter(teamV):list.filter(a=>a.rosterStatus==='Available-Other');$('tradeResults').innerHTML=list.slice(0,90).map(a=>`<div class="search-row" onclick="selectTrade('${mode}','${a.assetId}')"><b>${esc(name(a.name))}</b><br><span class="muted">${esc(a.teamAbbreviation)} · ${esc(a.position)} · OVR ${esc(ovr(a))} · ${m(a.salary)} · ${esc(a.rosterStatus)}</span></div>`).join('')}
function selectTrade(mode,id){let a=state.assets.find(x=>x.assetId===id);if(mode==='out'){if(!trade.outIds.includes(id))trade.outIds.push(id);closeModal();render();return}$('modal').innerHTML=`<div class="modal-card"><div class="modal-head"><h2>${esc(name(a.name))}</h2><button class="btn gray" onclick="closeModal()">Close</button></div><div class="form-grid"><div class="field"><label>Salary to Use</label><input id="inSalary" class="input" value="${esc(a.salary||0)}"></div><div class="field"><label>Retained by Other Team</label><input id="inRetained" class="input" value="0"></div><div class="field"><label>Destination</label><select id="inStatus"><option>NHL Roster</option><option selected>Non-Roster</option></select></div></div><button class="btn green" onclick="addIncoming('${id}')">Add Incoming</button></div>`}
function addIncoming(id){trade.incoming=trade.incoming.filter(x=>x.assetId!==id);trade.incoming.push({assetId:id,salary:$('inSalary').value,retainedSalary:$('inRetained').value,rosterStatus:$('inStatus').value});closeModal();render()} async function confirmTrade(){trade.changedBy=$('tradeBy').value;trade.notes=$('tradeNotes').value;if(!confirm('Complete this trade? This will update the roster and history.'))return;try{await post({action:'completeTrade',outIds:trade.outIds,incoming:trade.incoming,notes:trade.notes,changedBy:trade.changedBy});trade={outIds:[],incoming:[],notes:'',changedBy:''}}catch(e){alert(e.message)}}
load().catch(e=>{$('view').innerHTML=`<div class="notice red">${esc(e.message)}</div>`});
</script></body></html>
