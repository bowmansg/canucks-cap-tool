const TABS=['Overview','NHL Roster','Lineup','Non-Roster','Players','Free Agents','Trade Center','Expiring','Notes','History'];
const $=id=>document.getElementById(id);let state={assets:[],notes:[],history:[],lineup:[],settings:{},summary:{},tab:'Overview'};let trade={outIds:[],incoming:[],notes:'',changedBy:''};let filters={players:'All'};
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function name(n){return String(n||'').replace(/,([^ ])/g,', $1')}function sal(a){let n=Number(String(a?.salary??0).replace(/[$, ]/g,''));return isNaN(n)?0:n}function m(v){v=Number(v||0);let sign=v<0?'-':'';v=Math.abs(v);if(v>=1e6)return sign+'$'+(v/1e6).toFixed(v>=10?1:2)+'M';if(v>=1e3)return sign+'$'+(v/1e3).toFixed(0)+'K';return sign+'$'+v.toFixed(0)}function dur(x){let n=Math.round(Number(x||0));return n||''}function ovr(a){let n=Math.round(Number(a?.quality||a?.OVR||0));return n||''}function age(a){let n=Math.floor(Number(a?.age||0));return n||''}
function posTokens(a){return String(a?.position||'').toUpperCase().replace(/\s/g,'').split(/[^A-Z]+/).filter(Boolean)}function posGroup(a){let t=posTokens(a);if(t.includes('G'))return 'Goalies';if(t.some(x=>x==='DG'||x==='DD'))return 'Defense';if(t.some(x=>x==='C'||x==='AG'||x==='AD'))return 'Forwards';return 'Other'}function roleList(a){let t=posTokens(a),r=[];if(t.includes('AG'))r.push('LW');if(t.includes('C'))r.push('C');if(t.includes('AD'))r.push('RW');if(t.includes('DG'))r.push('LD');if(t.includes('DD'))r.push('RD');if(t.includes('G'))r.push('G');return r}function posDisplay(a){let r=roleList(a);return r.length?r.join('/'):(a.position||'')}function isNHL(a){return a.rosterStatus==='NHL Roster'}function isNon(a){return a.rosterStatus==='Non-Roster'}function isAvail(a){return a.rosterStatus==='Available-Other'}function isVan(a){return isNHL(a)||isNon(a)||String(a.teamAbbreviation||'').toUpperCase()===MANAGED_TEAM}function sortBest(list){return list.slice().sort((a,b)=>ovr(b)-ovr(a)||sal(b)-sal(a)||name(a.name).localeCompare(name(b.name)))}
async function load(){let r=await fetch(API_URL+'?action=getData'),d=await r.json();if(!d.ok)throw Error(d.error||'Load failed');state={...state,...d};$('lastUpdated').textContent='Updated '+new Date().toLocaleTimeString([],{hour:'numeric',minute:'2-digit'});render()}async function post(payload){let body=new URLSearchParams();body.set('payload',JSON.stringify(payload));let r=await fetch(API_URL,{method:'POST',body}),d=await r.json();if(!d.ok)throw Error(d.error||'Save failed');if(d.data)state={...state,...d.data};render()}
function render(){renderTabs();let fn={Overview:overview,NHLRoster:nhlRoster,Lineup:lineupView,NonRoster:nonRoster,Players:playersView,FreeAgents:freeAgents,TradeCenter:tradeView,Expiring:expiring,Notes:notesView,History:historyView}[state.tab.replace(/\s/g,'')];(fn||overview)()}function renderTabs(){$('tabs').innerHTML=TABS.map(t=>`<button class="tab ${state.tab===t?'active':''}" onclick="state.tab='${t}';render()">${t}</button>`).join('')}
function summary(){let cap=Number(state.summary.cap||0),nhl=state.assets.filter(isNHL),capHit=nhl.reduce((s,a)=>s+sal(a),0),space=cap-capHit,vanExp=state.assets.filter(a=>isVan(a)&&dur(a.contractDuration)===1).length,target=Number(localStorage.canucksTargetAdditions||3),budget=target?space/target:0;return{cap,nhl,capHit,space,target,budget,vanExp,open:23-nhl.length}}
function hero(){let s=summary();return `<div class="hero"><div class="heroTop"><div><div class="heroTitle">Vancouver Canucks Cap Overview</div><div class="heroSub">Hard cap protected · PuckPedia-style roster and cap management</div></div><span class="tag ${s.space>=0?'green':'red'}">${s.space>=0?'Under Cap':'Over Cap'}</span></div><div class="capbar"><div class="capcell"><div class="label">Projected Cap Hit</div><div class="value">${m(s.capHit)}</div></div><div class="capcell"><div class="label">Projected Cap Space</div><div class="value ${s.space>=0?'green':'red'}">${m(s.space)}</div></div><div class="capcell"><div class="label">NHL Roster</div><div class="value">${s.nhl.length}/23</div></div><div class="capcell"><div class="label">Open Spots</div><div class="value ${s.open>=0?'green':'orange'}">${s.open}</div></div><div class="capcell"><div class="label">Target Additions</div><div class="value">${s.target}</div></div><div class="capcell"><div class="label">Budget/Add</div><div class="value">${m(s.budget)}</div></div></div></div>`}
function groupTotals(list){return {count:list.length,total:list.reduce((s,a)=>s+sal(a),0),pct:summary().cap?list.reduce((s,a)=>s+sal(a),0)/summary().cap*100:0}}function table(list,opts={}){let showStatus=opts.status!==false;return `<div class="table-wrap"><table><thead><tr><th>Player</th><th>Pos</th><th>OVR</th><th class="hide-mobile">Age</th><th>Dur</th><th>Cap Hit</th>${showStatus?'<th>Status</th>':''}</tr></thead><tbody>${list.map(a=>`<tr onclick="openAsset('${esc(a.assetId)}')"><td class="namecell"><b>${esc(name(a.name))}</b><span>${esc(a.teamAbbreviation||'')} ${a.potential?'· '+esc(a.potential):''}</span></td><td>${esc(posDisplay(a))}</td><td><b>${esc(ovr(a))}</b></td><td class="hide-mobile">${esc(age(a))}</td><td>${esc(dur(a.contractDuration))}</td><td class="money">${m(sal(a))}</td>${showStatus?`<td><span class="tag ${isNHL(a)?'green':isNon(a)?'warn':''}">${esc(a.rosterStatus)}</span></td>`:''}</tr>`).join('')||`<tr><td colspan="${showStatus?7:6}" class="muted">No assets found.</td></tr>`}</tbody></table></div>`}
function rosterBlock(title,list){let g=groupTotals(list);return `<div class="rosterBlock"><div class="blockHead"><div class="blockTitle">${title}</div><div class="blockMeta">${g.count} · ${m(g.total)} · ${g.pct.toFixed(1)}% of cap</div></div>${table(sortBest(list),{status:false})}</div>`}
function overview(){let s=summary(),nhl=s.nhl,fw=nhl.filter(a=>posGroup(a)==='Forwards'),df=nhl.filter(a=>posGroup(a)==='Defense'),gl=nhl.filter(a=>posGroup(a)==='Goalies');$('view').innerHTML=hero()+`<div class="section"><div><h2>Cap Planner</h2><div class="subhead">Use this to plan the extra players you still need while staying under the hard cap.</div></div></div><div class="panel panel-pad"><div class="form-grid"><div class="field"><label>Target Additions</label><input id="targetAdd" type="number" min="1" step="1" class="input" value="${s.target}" onchange="localStorage.canucksTargetAdditions=this.value;render()"></div><div class="field"><label>Max Average Per Addition</label><input class="input" value="${m(s.budget)}" disabled></div></div><div class="notice ${s.space>=0?'green':'red'}">${s.space>=0?'You can add '+s.target+' NHL roster player(s) at an average of '+m(s.budget)+' and remain under the cap.':'Team is currently over the cap.'}</div></div><div class="section"><h2>NHL Roster Breakdown</h2></div>${rosterBlock('Forwards',fw)}${rosterBlock('Defense',df)}${rosterBlock('Goalies',gl)}<div class="section"><h2>Vancouver Expiring Contracts</h2><div class="subhead">${s.vanExp} Vancouver-controlled assets with 1 year remaining.</div></div>`}
function nhlRoster(){let nhl=state.assets.filter(isNHL);$('view').innerHTML=hero()+`<div class="section"><div><h2>NHL Roster Breakdown</h2><div class="subhead">Only NHL Roster assets count against the cap and 23-player roster limit.</div></div></div>${rosterBlock('Forwards',nhl.filter(a=>posGroup(a)==='Forwards'))}${rosterBlock('Defense',nhl.filter(a=>posGroup(a)==='Defense'))}${rosterBlock('Goalies',nhl.filter(a=>posGroup(a)==='Goalies'))}${rosterBlock('Other / Needs Classification',nhl.filter(a=>!['Forwards','Defense','Goalies'].includes(posGroup(a))))}`}
function defaultSlots(){return ['F1_LW|Forward|Line 1 LW|LW','F1_C|Forward|Line 1 C|C','F1_RW|Forward|Line 1 RW|RW','F2_LW|Forward|Line 2 LW|LW','F2_C|Forward|Line 2 C|C','F2_RW|Forward|Line 2 RW|RW','F3_LW|Forward|Line 3 LW|LW','F3_C|Forward|Line 3 C|C','F3_RW|Forward|Line 3 RW|RW','F4_LW|Forward|Line 4 LW|LW','F4_C|Forward|Line 4 C|C','F4_RW|Forward|Line 4 RW|RW','D1_LD|Defense|Pair 1 LD|LD','D1_RD|Defense|Pair 1 RD|RD','D2_LD|Defense|Pair 2 LD|LD','D2_RD|Defense|Pair 2 RD|RD','D3_LD|Defense|Pair 3 LD|LD','D3_RD|Defense|Pair 3 RD|RD','G1|Goalie|Starter|G','G2|Goalie|Backup|G'].map((x,i)=>{let [slotId,group,label,role]=x.split('|');let existing=(state.lineup||[]).find(s=>s.slotId===slotId)||{};return{slotId,group,label,role,assetId:existing.assetId||'',sortOrder:i+1}})}
function autoLineup(){let nhl=sortBest(state.assets.filter(isNHL)),used=new Set(),slots=defaultSlots();slots.forEach(slot=>{if(slot.assetId)used.add(slot.assetId)});slots.forEach(slot=>{if(slot.assetId)return;let pool=nhl.filter(a=>!used.has(a.assetId));if(slot.group==='Forward')pool=pool.filter(a=>posGroup(a)==='Forwards');if(slot.group==='Defense')pool=pool.filter(a=>posGroup(a)==='Defense');if(slot.group==='Goalie')pool=pool.filter(a=>posGroup(a)==='Goalies');let exact=pool.filter(a=>roleList(a).includes(slot.role));let pick=(exact[0]||pool[0]);if(pick){slot.assetId=pick.assetId;used.add(pick.assetId)}});return slots}
function cardFor(a){return a?`<div class="playerCard"><div class="cardRow"><div class="ovrBig">${esc(ovr(a))}</div><div><div class="pcName">${esc(name(a.name))}</div><div class="pcMeta">${esc(posDisplay(a))} · ${m(sal(a))} · ${dur(a.contractDuration)} yrs</div></div></div></div>`:'<div class="empty">Open Slot</div>'}function optionsFor(slot,selected){let nhl=sortBest(state.assets.filter(isNHL));let pool=nhl;if(slot.group==='Forward')pool=nhl.filter(a=>posGroup(a)==='Forwards');if(slot.group==='Defense')pool=nhl.filter(a=>posGroup(a)==='Defense');if(slot.group==='Goalie')pool=nhl.filter(a=>posGroup(a)==='Goalies');pool=pool.sort((a,b)=>(roleList(b).includes(slot.role)?1:0)-(roleList(a).includes(slot.role)?1:0)||ovr(b)-ovr(a));return `<option value="">Open</option>`+pool.map(a=>`<option value="${esc(a.assetId)}" ${a.assetId===selected?'selected':''}>${esc(name(a.name))} — ${esc(posDisplay(a))} · OVR ${esc(ovr(a))}</option>`).join('')}
function lineupView(){let slots=autoLineup();let renderSlot=s=>{let a=state.assets.find(x=>x.assetId===s.assetId);return `<div class="slot"><div class="slotHead"><span class="slotRole">${esc(s.label)}</span><span class="tag">${esc(s.role)}</span></div>${cardFor(a)}<select class="lineupSelect" id="lineup_${esc(s.slotId)}">${optionsFor(s,s.assetId)}</select></div>`};let rows=[0,3,6,9].map(i=>`<div class="lineLabel">Line ${i/3+1}</div><div class="lineGrid">${slots.slice(i,i+3).map(renderSlot).join('')}</div>`).join('');let pairs=[12,14,16].map((i,idx)=>`<div class="lineLabel">Pair ${idx+1}</div><div class="defGrid">${slots.slice(i,i+2).map(renderSlot).join('')}</div>`).join('');$('view').innerHTML=hero()+`<div class="section"><div><h2>Editable Lineup</h2><div class="subhead">Use dropdowns to arrange lines and pairs. Save to keep the lineup for Cam and Gabe.</div></div><button class="btn green" onclick="saveLineup()">Save Lineup</button></div><div class="panel panel-pad"><h3>Forwards</h3>${rows}<h3>Defense</h3>${pairs}<h3>Goalies</h3><div class="goalieGrid">${slots.slice(18,20).map(renderSlot).join('')}</div><div class="field"><label>Changed By</label><select id="lineupBy"><option value="">Choose…</option><option>Cam</option><option>Gabe</option></select></div><button class="btn green" onclick="saveLineup()">Save Lineup</button></div>`}
async function saveLineup(){let slots=defaultSlots().map(s=>({slotId:s.slotId,assetId:$('lineup_'+s.slotId).value}));try{await post({action:'saveLineup',slots,changedBy:$('lineupBy').value});alert('Lineup saved.')}catch(e){alert(e.message)}}
function nonRoster(){let list=state.assets.filter(isNon);$('view').innerHTML=hero()+`<div class="section"><div><h2>Non-Roster / AHL / Prospects</h2><div class="subhead">These do not count against the NHL cap unless called up.</div></div></div>${table(sortBest(list))}`}
function playersView(){let q=(document.getElementById('playerQ')?.value||'').toLowerCase();let list=state.assets.filter(a=>(name(a.name)+' '+a.teamAbbreviation+' '+posDisplay(a)+' '+a.rosterStatus).toLowerCase().includes(q));let f=filters.players;if(f==='Vancouver')list=list.filter(isVan);if(f==='Available / Other')list=list.filter(isAvail);if(f==='NHL Roster')list=list.filter(isNHL);if(f==='Non-Roster')list=list.filter(isNon);if(f==='Expiring')list=list.filter(a=>dur(a.contractDuration)===1);$('view').innerHTML=hero()+`<div class="section"><h2>Players / Assets</h2></div><input id="playerQ" class="input" placeholder="Search all players/assets…" value="${esc(q)}" oninput="playersView()"><div class="toolbar">${['All','Vancouver','Available / Other','NHL Roster','Non-Roster','Expiring'].map(x=>`<button class="pillFilter ${f===x?'active':''}" onclick="filters.players='${x}';playersView()">${x}</button>`).join('')}</div>${table(sortBest(list).slice(0,300))}`}
function freeAgents(){let q=(document.getElementById('faQ')?.value||'').toLowerCase();let list=state.assets.filter(isAvail).filter(a=>(name(a.name)+' '+a.teamAbbreviation+' '+posDisplay(a)).toLowerCase().includes(q));$('view').innerHTML=hero()+`<div class="section"><div><h2>Free Agents / Sign Player</h2><div class="subhead">Sign available assets to NHL Roster or Non-Roster. NHL signings are hard-cap checked.</div></div></div><input id="faQ" class="input" placeholder="Search free agents…" value="${esc(q)}" oninput="freeAgents()">${table(sortBest(list).slice(0,250))}`}
function expiring(){let van=state.assets.filter(a=>isVan(a)&&dur(a.contractDuration)===1),nhl=van.filter(isNHL),non=van.filter(isNon),other=state.assets.filter(a=>!isVan(a)&&dur(a.contractDuration)===1);$('view').innerHTML=hero()+`<div class="section"><h2>Expiring Contracts</h2></div>${rosterBlock('Vancouver NHL Roster Expiring',nhl)}${rosterBlock('Vancouver Non-Roster Expiring',non)}${rosterBlock('Other League Expiring',other)}`}
function notesView(){$('view').innerHTML=hero()+`<div class="section"><h2>Team Notes</h2></div><div class="panel panel-pad"><div class="form-grid"><div class="field"><label>Changed By</label><select id="teamNoteBy"><option value="">Choose…</option><option>Cam</option><option>Gabe</option></select></div><div class="field"><label>Title</label><input id="teamNoteTitle" class="input" value="Team Note"></div></div><textarea id="teamNoteText" placeholder="Trade ideas, signing plans, cap notes…"></textarea><button class="btn green" onclick="saveTeamNote()">Save Team Note</button></div><div class="section"><h2>Recent Notes</h2></div>${(state.notes||[]).slice().reverse().map(n=>`<div class="notice warn"><b>${esc(n.title||n.scope)}</b> · ${esc(n.changedBy)}<br>${esc(n.body||n.noteText||'')}</div>`).join('')}`}
async function saveTeamNote(){try{await post({action:'saveTeamNote',changedBy:$('teamNoteBy').value,title:$('teamNoteTitle').value,noteText:$('teamNoteText').value})}catch(e){alert(e.message)}}
function historyView(){$('view').innerHTML=hero()+`<div class="section"><h2>Read-Only History</h2></div><div class="table-wrap"><table><thead><tr><th>Time</th><th>Action</th><th>By</th><th>Summary</th></tr></thead><tbody>${(state.history||[]).map(h=>`<tr><td>${esc(new Date(h.timestamp).toLocaleString())}</td><td>${esc(h.action)}</td><td>${esc(h.changedBy)}</td><td>${esc(h.summary)}</td></tr>`).join('')}</tbody></table></div>`}
function openAsset(id){let a=state.assets.find(x=>x.assetId===id);if(!a)return;let teamNotes=(state.notes||[]).filter(n=>n.assetId===id);$('modal').className='modal';$('modal').innerHTML=`<div class="modal-card"><div class="modal-head"><div><h2>${esc(name(a.name))}</h2><div class="muted">${esc(a.teamAbbreviation)} · ${esc(posDisplay(a))} · OVR ${esc(ovr(a))} · ${esc(a.rosterStatus)}</div></div><button class="btn gray" onclick="closeModal()">Close</button></div><div class="four"><div class="stat"><div class="label">Cap Hit</div><div class="value">${m(sal(a))}</div></div><div class="stat"><div class="label">Duration</div><div class="value">${dur(a.contractDuration)}</div></div><div class="stat"><div class="label">Age</div><div class="value">${age(a)}</div></div><div class="stat"><div class="label">Type</div><div class="value small">${esc(a.assetType||'')}</div></div></div><div class="form-grid"><div class="field"><label>Salary</label><input id="assetSalary" class="input" value="${esc(a.salary||0)}"></div><div class="field"><label>Contract Duration</label><input id="assetDuration" type="number" step="1" class="input" value="${esc(dur(a.contractDuration)||1)}"></div><div class="field"><label>Asset Type</label><select id="assetType"><option>NHL Player</option><option>AHL Player</option><option>Prospect</option><option>Draft Pick</option><option>Other</option></select></div><div class="field"><label>Roster Status</label><select id="assetStatus"><option>NHL Roster</option><option>Non-Roster</option><option>Available-Other</option></select></div><div class="field"><label>Changed By</label><select id="assetBy"><option value="">Choose…</option><option>Cam</option><option>Gabe</option></select></div></div><div class="field"><label>Player Notes</label><textarea id="assetNotes">${esc(a.playerNotes||'')}</textarea></div><div class="toolbar"><button class="btn green" onclick="saveAsset('${id}')">Save Player</button>${isNon(a)?`<button class="btn" onclick="quickMove('${id}','NHL Roster')">Call Up</button>`:''}${isNHL(a)?`<button class="btn dark" onclick="quickMove('${id}','Non-Roster')">Send Down</button>`:''}${isAvail(a)?`<button class="btn green" onclick="openSigning('${id}')">Sign Player</button>`:''}</div><div class="section"><h2>Add Player Note</h2></div><textarea id="newPlayerNote"></textarea><button class="btn green" onclick="savePlayerNote('${id}')">Save Player Note</button>${teamNotes.map(n=>`<div class="notice warn"><b>${esc(n.changedBy)}</b>: ${esc(n.body)}</div>`).join('')}</div>`;$('assetType').value=a.assetType||'NHL Player';$('assetStatus').value=a.rosterStatus||'Available-Other'}function closeModal(){$('modal').className='hidden';$('modal').innerHTML=''}async function saveAsset(id){try{await post({action:'updateAsset',assetId:id,salary:$('assetSalary').value,contractDuration:$('assetDuration').value,assetType:$('assetType').value,playerNotes:$('assetNotes').value,changedBy:$('assetBy').value});closeModal()}catch(e){alert(e.message)}}async function quickMove(id,status){let by=$('assetBy').value;if(!confirm((status==='NHL Roster'?'Call up':'Send down')+' this player?'))return;try{await post({action:'moveAsset',assetId:id,rosterStatus:status,changedBy:by});closeModal()}catch(e){alert(e.message)}}async function savePlayerNote(id){try{await post({action:'savePlayerNote',assetId:id,changedBy:$('assetBy').value,noteText:$('newPlayerNote').value,title:'Player Note'});openAsset(id)}catch(e){alert(e.message)}}
function openSigning(id){let a=state.assets.find(x=>x.assetId===id);$('modal').className='modal';$('modal').innerHTML=`<div class="modal-card"><div class="modal-head"><div><h2>Sign ${esc(name(a.name))}</h2><div class="muted">${esc(posDisplay(a))} · OVR ${esc(ovr(a))} · Current ${m(sal(a))}</div></div><button class="btn gray" onclick="closeModal()">Close</button></div><div class="form-grid"><div class="field"><label>New Salary</label><input id="signSalary" class="input" value="${esc(a.salary||0)}"></div><div class="field"><label>Contract Duration</label><input id="signDuration" class="input" type="number" step="1" value="${esc(dur(a.contractDuration)||1)}"></div><div class="field"><label>Destination</label><select id="signStatus"><option>NHL Roster</option><option selected>Non-Roster</option></select></div><div class="field"><label>Changed By</label><select id="signBy"><option value="">Choose…</option><option>Cam</option><option>Gabe</option></select></div></div><div class="field"><label>Signing Notes</label><textarea id="signNotes"></textarea></div><button class="btn green" onclick="confirmSigning('${id}')">Preview / Confirm Signing</button></div>`}async function confirmSigning(id){let a=state.assets.find(x=>x.assetId===id),salary=Number($('signSalary').value||0),status=$('signStatus').value,current=summary().capHit,newCap=current+(status==='NHL Roster'?salary:0),cap=summary().cap;if(newCap>cap){alert('You cannot complete this signing, as this will have you OVER the salary cap.');return}if(!confirm(`Sign ${name(a.name)}?\nProjected cap hit: ${m(newCap)}\nProjected cap space: ${m(cap-newCap)}`))return;try{await post({action:'signFreeAgent',assetId:id,salary:$('signSalary').value,contractDuration:$('signDuration').value,rosterStatus:status,changedBy:$('signBy').value,notes:$('signNotes').value});closeModal()}catch(e){alert(e.message)}}
function tradeView(){let out=trade.outIds.map(id=>state.assets.find(a=>a.assetId===id)).filter(Boolean),inn=trade.incoming.map(x=>({item:x,asset:state.assets.find(a=>a.assetId===x.assetId)})).filter(x=>x.asset);let current=summary().capHit,outCap=out.filter(isNHL).reduce((s,a)=>s+sal(a),0),inCap=inn.filter(x=>x.item.rosterStatus==='NHL Roster').reduce((s,x)=>s+Math.max(0,Number(x.item.salary||x.asset.salary||0)-Number(x.item.retainedSalary||0)),0),newCap=current-outCap+inCap,cap=summary().cap,over=newCap>cap;$('view').innerHTML=hero()+`<div class="section"><div><h2>Trade Center</h2><div class="subhead">Build a trade, preview the cap impact, then confirm. Nothing saves until confirmation.</div></div></div>${over?`<div class="notice red">You cannot complete this trade, as this will have you OVER the salary cap.</div>`:''}<div class="split"><div class="panel panel-pad"><h3>Vancouver Sends</h3><button class="btn" onclick="openTradeSearch('out')">+ Add Outgoing Asset</button>${out.map(a=>chip(a,`removeOut('${a.assetId}')`)).join('')||'<p class="muted">No outgoing assets selected.</p>'}</div><div class="panel panel-pad"><h3>Vancouver Receives</h3><button class="btn" onclick="openTradeSearch('in')">+ Add Incoming Asset</button>${inn.map(inChip).join('')||'<p class="muted">No incoming assets selected.</p>'}</div></div><div class="section"><h2>Cap Impact</h2></div><div class="panel panel-pad"><div class="summary-line"><span>Current Cap Hit</span><b>${m(current)}</b></div><div class="summary-line"><span>Outgoing NHL Cap Removed</span><b>-${m(outCap)}</b></div><div class="summary-line"><span>Incoming NHL Cap Added</span><b>+${m(inCap)}</b></div><div class="summary-line"><span>Projected Cap Hit</span><b class="${over?'red':'green'}">${m(newCap)}</b></div><div class="summary-line"><span>Projected Cap Space</span><b>${m(cap-newCap)}</b></div><div class="form-grid"><div class="field"><label>Changed By</label><select id="tradeBy"><option value="">Choose…</option><option ${trade.changedBy==='Cam'?'selected':''}>Cam</option><option ${trade.changedBy==='Gabe'?'selected':''}>Gabe</option></select></div></div><div class="field"><label>Trade Notes</label><textarea id="tradeNotes" oninput="trade.notes=this.value">${esc(trade.notes||'')}</textarea></div><button class="btn green" ${over||(!out.length&&!inn.length)?'disabled':''} onclick="confirmTrade()">Confirm Trade</button></div>`}
function chip(a,call){return `<div class="asset-chip"><div><b>${esc(name(a.name))}</b><div class="muted small">${esc(posDisplay(a))} · OVR ${esc(ovr(a))} · ${m(sal(a))} · ${esc(a.rosterStatus)}</div></div><button class="btn red" onclick="${call}">Remove</button></div>`}function inChip(x){let a=x.asset,i=x.item;return `<div class="asset-chip"><div><b>${esc(name(a.name))}</b><div class="muted small">${esc(posDisplay(a))} · ${m(i.salary||a.salary)} less retained ${m(i.retainedSalary||0)} → ${esc(i.rosterStatus)}</div></div><button class="btn red" onclick="removeIn('${a.assetId}')">Remove</button></div>`}function removeOut(id){trade.outIds=trade.outIds.filter(x=>x!==id);render()}function removeIn(id){trade.incoming=trade.incoming.filter(x=>x.assetId!==id);render()}function openTradeSearch(mode){$('modal').className='modal';$('modal').innerHTML=`<div class="modal-card"><div class="modal-head"><h2>Add ${mode==='out'?'Outgoing':'Incoming'} Asset</h2><button class="btn gray" onclick="closeModal()">Close</button></div><input class="input" id="tradeSearch" placeholder="Search assets…" oninput="renderTradeResults('${mode}')"><div id="tradeResults" class="search-results"></div></div>`;renderTradeResults(mode)}function renderTradeResults(mode){let q=($('tradeSearch')?.value||'').toLowerCase(),list=state.assets.filter(a=>(name(a.name)+' '+String(a.teamAbbreviation)+' '+posDisplay(a)).toLowerCase().includes(q));list=mode==='out'?list.filter(isVan):list.filter(a=>!isVan(a)||isAvail(a));$('tradeResults').innerHTML=sortBest(list).slice(0,100).map(a=>`<div class="search-row" onclick="selectTrade('${mode}','${a.assetId}')"><b>${esc(name(a.name))}</b><br><span class="muted">${esc(a.teamAbbreviation)} · ${esc(posDisplay(a))} · OVR ${esc(ovr(a))} · ${m(sal(a))} · ${esc(a.rosterStatus)}</span></div>`).join('')}function selectTrade(mode,id){let a=state.assets.find(x=>x.assetId===id);if(mode==='out'){if(!trade.outIds.includes(id))trade.outIds.push(id);closeModal();render();return}$('modal').innerHTML=`<div class="modal-card"><div class="modal-head"><h2>${esc(name(a.name))}</h2><button class="btn gray" onclick="closeModal()">Close</button></div><div class="form-grid"><div class="field"><label>Salary to Use</label><input id="inSalary" class="input" value="${esc(a.salary||0)}"></div><div class="field"><label>Retained by Other Team</label><input id="inRetained" class="input" value="0"></div><div class="field"><label>Destination</label><select id="inStatus"><option>NHL Roster</option><option selected>Non-Roster</option></select></div></div><button class="btn green" onclick="addIncoming('${id}')">Add Incoming</button></div>`}function addIncoming(id){trade.incoming=trade.incoming.filter(x=>x.assetId!==id);trade.incoming.push({assetId:id,salary:$('inSalary').value,retainedSalary:$('inRetained').value,rosterStatus:$('inStatus').value});closeModal();render()}async function confirmTrade(){trade.changedBy=$('tradeBy').value;trade.notes=$('tradeNotes').value;if(!confirm('Complete this trade? This will update the roster and history.'))return;try{await post({action:'completeTrade',outIds:trade.outIds,incoming:trade.incoming,notes:trade.notes,changedBy:trade.changedBy});trade={outIds:[],incoming:[],notes:'',changedBy:''}}catch(e){alert(e.message)}}
load().catch(e=>{$('view').innerHTML=`<div class="notice red">${esc(e.message)}</div>`});
</script></body></html>
